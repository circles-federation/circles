# Railway deploy config — see CLAUDE.md's Data access layer / Email sections
# for why this needs a persistent process (the notification poller in
# instrumentation.ts) rather than a serverless host. Nixpacks auto-detects
# Next.js from package.json, so this only makes the build/start/health shape
# explicit rather than leaving it to the dashboard.
#
# Not set here, because Railway doesn't expose them as file-level config:
# - Env vars (DATABASE_URL from the Postgres plugin, BETTER_AUTH_SECRET,
#   BETTER_AUTH_URL, SMTP_URL, EMAIL_FROM, DIGEST_HOUR, TZ) — set in the
#   service's Variables tab. See .env.example for what each one is.
# - Replica count — keep this service at 1. The notification poller and the
#   login-code cooldown are both in-process state; a second replica would
#   split a member's digest across two emails and reset the cooldown per
#   instance (documented in CLAUDE.md's Event notifications section).
# - Running `npm run db:migrate` — do this manually via `railway run` before
#   a deploy that changes lib/db/schema.ts, not automatically on every boot,
#   so two replicas booting at once can't race the same migration.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
