# Local Postgres for development. No managed service, no vendor lock-in —
# `docker compose up -d` to start, `docker compose down -v` to wipe it clean
# (drops the named volume too, so the next start is a truly fresh database).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: convene
      POSTGRES_PASSWORD: convene
      POSTGRES_DB: convene
    ports:
      - "5432:5432"
    volumes:
      - convene_postgres_data:/var/lib/postgresql/data

volumes:
  convene_postgres_data:
